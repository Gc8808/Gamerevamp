<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Adityagadre.com</title>
<link rel="icon" type="image/png" href="unnamed (2).jpg" />
<style>
  /* existing styles kept as-is... */

  /* Dark mode toggle style */
  .toggle-mode {
    position: fixed;
    top: 20px;
    right: 20px;
    background: linear-gradient(45deg, #333, #777);
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    z-index: 1000;
    font-weight: 700;
  }

  body.dark-mode {
    background-color: #121212;
    color: #eee;
    background-image: none;
  }

  body.dark-mode main,
  body.dark-mode #game {
    background: rgba(33, 33, 33, 0.95);
  }

  body.dark-mode .section-title,
  body.dark-mode .author,
  body.dark-mode #funFact,
  body.dark-mode #scoreboard,
  body.dark-mode #timer {
    color: #90caf9;
  }

  /* Joke output */
  #aiJoke {
    margin-top: 1.2rem;
    font-weight: 600;
    font-size: 1.1rem;
    color: #4caf50;
    min-height: 2rem;
    text-align: center;
  }
</style>
</head>
<body>

<!-- Dark Mode Toggle Button -->
<button class="toggle-mode" id="toggleMode">Toggle Dark Mode</button>

<!-- [keep your existing header and main sections...] -->

<!-- New AI Joke Section -->
<section>
  <h2 class="section-title">AI Joke Generator (Laugh at Your Own Risk)</h2>
  <button class="fun-fact-btn" id="jokeBtn">Tell me a joke!</button>
  <div id="aiJoke"></div>
</section>

<!-- [keep the #game section and footer...] -->

<script>
  // Existing scripts...

  // Dark Mode Toggle
  const toggleModeBtn = document.getElementById('toggleMode');
  toggleModeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
  });

  // AI Joke Generator
  const jokes = [
    "Why did the neural network break up with the decision tree? It found someone deeper!",
    "I asked my AI assistant to tell me a joke. It replied: 'I’m laughing... internally.'",
    "Why did the AI cross the road? Because it was trained on millions of chickens doing it!",
    "ChatGPT walks into a bar... and instantly knows everyone's drink order.",
    "My AI tried stand-up comedy. The crowd was speechless — literally, they were all bots."
  ];

  const jokeBtn = document.getElementById('jokeBtn');
  const aiJokeDiv = document.getElementById('aiJoke');

  jokeBtn.addEventListener('click', () => {
    const joke = jokes[Math.floor(Math.random() * jokes.length)];
    aiJokeDiv.textContent = joke;
  });
</script>

</body>
</html>
